#app { position:relative; z-index:1; max-width:480px; margin:0 auto; padding:0 20px 80px; min-height:100vh; }
input, button { font-family:inherit; }
input::placeholder { color:#c8c5c0; }
input:focus { outline:none; }
.glass { background:rgba(255,255,255,0.82); border:1px solid rgba(232,229,224,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0 0 20px; }
.modal-box { background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:480px; }
.tab-bar { display:flex;border-bottom:1px solid rgba(224,221,216,0.6);overflow-x:auto;margin-top:18px; }
.tab-btn { flex:1;padding:10px 4px;border:none;background:transparent;font-size:12px;white-space:nowrap;color:#555;font-weight:400;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;cursor:pointer; }
.tab-btn.active { color:#111;font-weight:600;border-bottom-color:#111; }
/* タスク行 */
.task-wrap { margin-bottom:8px; }
.task-wrap.compact { margin-bottom:0; }
.task-row { display:flex;align-items:center;gap:8px;padding:13px 14px;border-radius:12px; }
.task-row.glass-row { background:rgba(255,255,255,0.82);border:1px solid rgba(236,233,228,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px); }
.task-row.compact-row { padding:10px 2px;border-bottom:1px solid rgba(245,242,238,0.8); }
.task-row.done { opacity:0.5; }
/* チェックボックス */
.chk { width:24px;height:24px;border-radius:6px;flex-shrink:0;border:1.5px solid #d0cdc8;background:transparent;display:flex;align-items:center;justify-content:center;transition:all 0.2s;cursor:pointer; }
.chk.on { border:none;background:#111; }
.chk.sm { width:18px;height:18px;border-radius:5px; }
.chk.sm.on { background:#555; }
/* オプションボタン */
.opt-toggle { background:none;border:none;color:#bbb;font-size:18px;padding:0 4px;line-height:1;cursor:pointer;flex-shrink:0; }
.opt-menu { display:none;align-items:center;gap:4px; }
.opt-menu.open { display:flex; }
.opt-btn { padding:4px 8px;border-radius:8px;border:1px solid #e0ddd8;background:rgba(249,248,245,0.9);color:#777;font-size:11px;white-space:nowrap;cursor:pointer; }
.opt-del { background:none;border:none;color:#ccc;font-size:15px;padding:0 2px;line-height:1;cursor:pointer; }
/* 小タスク */
.sub-list { margin-left:14px; }
.sub-row { display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,0.82);border:1px solid rgba(236,233,228,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px); }
.sub-opt-menu { display:none;align-items:center;gap:4px; }
.sub-opt-menu.open { display:flex; }
.sub-input-wrap { display:flex;gap:6px;margin-left:22px;margin-top:4px;margin-bottom:4px; }
.sub-input-wrap input { flex:1;padding:7px 10px;border-radius:8px;border:1px solid rgba(224,221,216,0.8);background:rgba(255,255,255,0.9);color:#111;font-size:13px; }
.sub-input-wrap input:focus { border-color:#111; }
/* その他 */
.week-card { margin-bottom:14px;border-radius:14px;border:1px solid rgba(232,229,224,0.6);background:rgba(255,255,255,0.78);overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px); }
.week-card.cur { border:1.5px solid #111; }
.week-hd { display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(240,237,232,0.6); }
.week-hd.cur { background:#111; }
.carryover { margin-bottom:14px;padding:10px 14px;border-radius:12px;background:rgba(255,251,240,0.85);border:1px solid rgba(240,229,192,0.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px); }
.habit-box { margin-top:12px;padding:10px 14px;border-radius:12px;background:rgba(240,248,255,0.85);border:1px solid rgba(180,210,255,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px); }
.year-banner { margin-top:18px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.82);border:1px solid rgba(232,229,224,0.7);border-left:3px solid #7c9e87;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px); }
.input-row { display:flex;gap:8px;margin-top:14px; }
.main-input { flex:1;padding:13px 14px;border-radius:12px;border:1.5px solid rgba(224,221,216,0.8);background:rgba(255,255,255,0.85);color:#111;font-size:16px;backdrop-filter:blur(8px); }
.main-input:focus { border-color:#111; }
.add-btn { width:48px;height:48px;border-radius:12px;border:none;background:#111;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0; }
.empty-msg { text-align:center;color:#bbb;padding:36px 0;font-size:14px; }
</style>

      headers:{"Content-Type":"text/plain"}
    });
  }catch(e){console.log("GAS save error:",e);}
}

// Date utils
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function isoWeek(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+3);
  const j4=new Date(d.getFullYear(),0,4);j4.setDate(j4.getDate()-(j4.getDay()+6)%7+3);
  return Math.round((d-j4)/604800000)+1;
}
function weekYear(date){const d=new Date(date),w=isoWeek(d);if(w>50&&d.getMonth()===0)return d.getFullYear()-1;if(w===1&&d.getMonth()===11)return d.getFullYear()+1;return d.getFullYear();}
function monday(yr,wk){const j4=new Date(yr,0,4);j4.setDate(j4.getDate()-(j4.getDay()+6)%7+(wk-1)*7);return j4;}
function sunday(yr,wk){const m=monday(yr,wk),s=new Date(m);s.setDate(m.getDate()+6);s.setHours(23,59,59,999);return s;}
const yp=()=>"y"+new Date().getFullYear();
const mp=()=>{const d=new Date();return "m"+d.getFullYear()+"-"+d.getMonth();}
const dp=()=>{const d=new Date();return "d"+d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
const wp=(y,w)=>"w"+y+"-"+String(w).padStart(2,"0");
const curW=()=>isoWeek(new Date());
const curWY=()=>weekYear(new Date());
function dispWeeks(){const ws=[];for(let i=0;i<4;i++){let w=curW()+i,y=curWY();const mx=isoWeek(new Date(y,11,28));if(w>mx){w-=mx;y++;}ws.push({year:y,week:w});}return ws;}
const dayPast=p=>p<dp();
const weekPast=(y,w)=>sunday(y,w)<new Date();

// State
let S={
  tasks:[],tab:"今日",syncing:false,
  yearInput:"",monthInput:"",dayInput:"",habitInput:"",
  weekInputs:{},movingToWeek:null,movingToDay:null,
};
try{S.tasks=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){}

function set(p){Object.assign(S,p);render();}

// Derived
function D(){
  const t=S.tasks,YP=yp(),MP=mp(),DP=dp();
  return{
    YP,MP,DP,
    yearGoals:t.filter(x=>x.period===YP&&!x.parentId),
    monthTasks:t.filter(x=>x.period===MP&&!x.done&&!x.parentId),
    monthDone:t.filter(x=>x.period===MP&&x.done&&!x.parentId),
    dayTasks:t.filter(x=>x.period===DP&&!x.done&&!x.parentId),
    dayDone:t.filter(x=>x.period===DP&&x.done&&!x.parentId),
    dayCarry:t.filter(x=>x.period.startsWith("d")&&dayPast(x.period)&&!x.done&&!x.parentId),
    habitTasks:t.filter(x=>x.period==="habit"),
    weekCarry:t.filter(x=>{if(!x.period.startsWith("w")||x.done||x.parentId)return false;const m=x.period.match(/^w(\d+)-(\d+)$/);if(!m)return false;return weekPast(+m[1],+m[2]);}),
    completedAll:(()=>{
      // sourceIdを持つタスクのsourceIdセットを作る（今日へ移動済みのオリジナルを除外）
      const movedIds=new Set(t.filter(x=>x.sourceId).map(x=>x.sourceId));
      return t.filter(x=>{
        if(x.period===YP)return false;
        // 今日へ移動されたオリジナル（週タスク）は除外
        if(movedIds.has(x.id)&&x.period.startsWith("w"))return false;
        if(x.period.startsWith("d")&&dayPast(x.period)&&x.done)return true;
        if(x.period.startsWith("w")&&x.done)return true;
        if(x.period.startsWith("m")&&x.done)return true;
        return false;
      }).sort((a,b)=>b.period.localeCompare(a.period));
    })(),
    wTasks:(y,w)=>t.filter(x=>x.period===wp(y,w)&&!x.done&&!x.parentId),
    wDone:(y,w)=>t.filter(x=>x.period===wp(y,w)&&x.done&&!x.parentId),
    subs:pid=>t.filter(x=>x.parentId===pid),
  };
}

// Task ops
function save(tasks){localStorage.setItem(KEY,JSON.stringify(tasks));if(tasks.length>0)saveGAS(tasks);set({tasks});}
function addTask(text,period,extra={}){if(!text.trim())return false;save([...S.tasks,{id:uid(),text:text.trim(),period,done:false,...extra}]);return true;}
function addSub(parentId,text,period){if(!text.trim())return false;save([...S.tasks,{id:uid(),text:text.trim(),period,done:false,parentId}]);return true;}
function toggleTask(id){
  const tg=S.tasks.find(t=>t.id===id);if(!tg)return;
  const nd=!tg.done;
  save(S.tasks.map(t=>{if(t.id===id)return{...t,done:nd};if(tg.sourceId&&t.id===tg.sourceId)return{...t,done:nd};if(t.sourceId&&t.sourceId===id)return{...t,done:nd};return t;}));
}
function removeTask(id){save(S.tasks.filter(t=>t.id!==id&&t.sourceId!==id&&t.parentId!==id));}
function moveToWeek(taskId,yr,wk){
  const src=S.tasks.find(t=>t.id===taskId);if(!src)return;
  const p=wp(yr,wk);
  if(!S.tasks.some(t=>t.sourceId===taskId&&t.period===p))save([...S.tasks,{id:uid(),text:src.text,period:p,done:src.done,sourceId:taskId}]);
  set({movingToWeek:null});
}
function moveToDay(taskId){
  const DP=dp(),src=S.tasks.find(t=>t.id===taskId);if(!src)return;
  if(!S.tasks.some(t=>t.sourceId===taskId&&t.period===DP))save([...S.tasks,{id:uid(),text:src.text,period:DP,done:src.done,sourceId:taskId}]);
  set({movingToDay:null});
}

// Escape HTML
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// Checkbox SVG
const CHK=`<svg width="11" height="11" viewBox="0 0 11 11"><path d="M1.5 5.5L4 8L9.5 2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHKSM=`<svg width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// Toggle option menu
function toggleOpt(id){
  const m=document.getElementById("opt-"+id);
  if(!m)return;
  // インライン表示（display:none/flex切り替え）とクラス方式の両対応
  if(m.style.display==="none"||m.style.display===""){
    // 他を全部閉じる
    document.querySelectorAll(".opt-menu").forEach(el=>{
      if(el.id!=="opt-"+id){el.style.display="none";el.classList.remove("open");}
    });
    m.style.display="flex";
    m.classList.add("open");
  } else {
    m.style.display="none";
    m.classList.remove("open");
  }
}
function toggleSubOpt(id){
  const m=document.getElementById("subopt-"+id);
  if(m)m.classList.toggle("open");
}
// Toggle sub input
function toggleSubInput(parentId){
  const existing=document.getElementById("subinput-wrap-"+parentId);
  if(existing){existing.remove();return;}
  const task=S.tasks.find(t=>t.id===parentId);
  const period=task?task.period:dp();
  const wrap=document.createElement("div");
  wrap.id="subinput-wrap-"+parentId;
  wrap.className="sub-input-wrap";
  wrap.innerHTML=`<input id="subinput-${parentId}" placeholder="小タスクを追加…"><button onclick="submitSub('${parentId}')">+</button><button style="padding:7px 10px;border-radius:8px;border:none;background:transparent;color:#ccc;font-size:16px;cursor:pointer" onclick="document.getElementById('subinput-wrap-${parentId}').remove()">✕</button>`;
  const anchor=document.getElementById("task-anchor-"+parentId);
  if(anchor&&anchor.parentNode){
    anchor.parentNode.insertBefore(wrap,anchor.nextSibling);
    const inp=document.getElementById("subinput-"+parentId);
    if(inp){
      let composing=false;
      inp.addEventListener("compositionstart",()=>composing=true);
      inp.addEventListener("compositionend",()=>composing=false);
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!composing)submitSub(parentId);});
      inp.focus();
    }
  }
}
function submitSub(parentId){
  const inp=document.getElementById("subinput-"+parentId);if(!inp)return;
  const task=S.tasks.find(t=>t.id===parentId);
  if(addSub(parentId,inp.value,task?task.period:dp())){
    const wrap=document.getElementById("subinput-wrap-"+parentId);if(wrap)wrap.remove();
  }
}

  const subInputHTML=`<div id="subinp-${tid}" class="sub-input-wrap" style="display:none">

          <button class="opt-del" onclick="removeTask('${tid}');toggleOpt('${tid}')">✕</button>
        </div>
      </div>

function taskHTML(task, compact=false, actionLabel="", actionFn="", showSrc=false){
  const d=D();
  const subs=d.subs(task.id);
  const hasSubs=subs.length>0;
  const tid=task.id;
  const chkClass=`chk ${task.done?"on":""} ${compact?"sm":""}`;
  const subCount=hasSubs?`<span style="font-size:11px;color:#aaa;margin-left:5px">${subs.filter(s=>s.done).length}/${subs.length}</span>`:"";
  const srcBadge=showSrc?`<span style="font-size:11px;color:#bbb;margin-left:5px">↩移動済</span>`:"";

  // Option menu
  const optItems=[];
  if(actionLabel) optItems.push(`<button class="opt-btn" onclick="${actionFn};toggleOpt('${tid}')">${actionLabel}</button>`);
  optItems.push(`<button class="opt-btn" onclick="toggleSubInput('${tid}');toggleOpt('${tid}')">＋</button>`);
  optItems.push(`<button class="opt-del" onclick="removeTask('${tid}')">✕</button>`);

  const rowClass=compact?"task-row compact-row":"task-row glass-row";
  const wrapClass=compact?"task-wrap compact":"task-wrap";

  // Sub rows
  const subRows=subs.map(sub=>{
    const subOptItems=[];
    // 小タスクにも今日への移動
    subOptItems.push(`<button class="opt-btn" onclick="set({movingToDay:'${sub.id}'});toggleSubOpt('${sub.id}')">今日へ</button>`);
    subOptItems.push(`<button class="opt-del" onclick="removeTask('${sub.id}')">✕</button>`);
    return `<div class="sub-row">
      <div class="${`chk sm ${sub.done?"on":""}`}" onclick="toggleTask('${sub.id}')">${sub.done?CHKSM:""}</div>
      <span style="flex:1;font-size:13px;color:${sub.done?"#bbb":"#333"};text-decoration:${sub.done?"line-through":"none"};line-height:1.4">${esc(sub.text)}</span>
      <button class="opt-toggle" onclick="toggleSubOpt('${sub.id}')">···</button>
      <div id="subopt-${sub.id}" class="sub-opt-menu">${subOptItems.join("")}</div>
    </div>`;
  }).join("");

  return `<div id="task-anchor-${tid}" class="${wrapClass}">
    <div class="${rowClass} ${task.done?"done":""}">
      <div class="${chkClass}" onclick="toggleTask('${tid}')">${task.done?(compact?CHKSM:CHK):""}</div>
      <span style="flex:1;font-size:${compact?14:15}px;color:${task.done?"#bbb":"#111"};text-decoration:${task.done?"line-through":"none"};line-height:1.5">${esc(task.text)}${srcBadge}${subCount}</span>
      <button class="opt-toggle" onclick="toggleOpt('${tid}')">···</button>
      <div id="opt-${tid}" class="opt-menu">${optItems.join("")}</div>
    </div>
    ${hasSubs?`<div class="sub-list">${subRows}</div>`:""}
  </div>`;
}

// Progress bar
function progBar(tasks){
  if(!tasks.length)return"";
  const done=tasks.filter(t=>t.done).length,pct=Math.round(done/tasks.length*100);
  return`<div style="margin-bottom:4px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:12px;color:#333">${done} / ${tasks.length} 完了</span><span style="font-size:16px;font-weight:600;color:#111">${pct}%</span></div><div style="height:2px;background:rgba(224,221,216,0.6);border-radius:99px"><div style="height:100%;border-radius:99px;width:${pct}%;background:#111;transition:width 0.5s ease"></div></div></div>`;
}

      ${d.dayCarry.length>0?`<div class="carryover" style="margin-top:12px"><p style="font-size:11px;color:#c8a830;font-weight:600;margin-bottom:8px">↩ 持ち越し</p>${d.dayCarry.map(t=>taskHTML(t,true)).join("")}</div>`:""}
      <div style="margin-top:10px">
        ${d.dayTasks.length===0&&d.dayDone.length===0&&d.dayCarry.length===0?'<p class="empty-msg">今日やることを追加しよう</p>':""}
        ${d.dayTasks.map(t=>taskHTML(t,false,"","",!!t.sourceId)).join("")}
        ${d.dayDone.length>0?`<div style="margin-top:8px"><p style="font-size:11px;color:#333;margin:0 0 6px 2px">完了 ${d.dayDone.length}件</p>${d.dayDone.map(t=>taskHTML(t)).join("")}</div>`:""}
      </div></div>`;
  }
  else if(tab==="今週"){
    h+=`<div style="margin-top:16px">
      ${d.weekCarry.length>0?`<div class="carryover"><p style="font-size:11px;color:#c8a830;font-weight:600;margin-bottom:8px">↩ 持ち越し</p>${d.weekCarry.map(t=>taskHTML(t,true,"今日へ",`set({movingToDay:'${t.id}'})`)).join("")}</div>`:""}
      ${dw.map(({year:y,week:w})=>{
        const ic=w===curW()&&y===curWY(),wt=d.wTasks(y,w),wd=d.wDone(y,w),m=monday(y,w),s=sunday(y,w),wk=y+"-"+w;
        return`<div class="week-card ${ic?"cur":""}">
          <div class="week-hd ${ic?"cur":""}">
            <div><span style="font-size:14px;font-weight:600;color:${ic?"#fff":"#888"}">第${w}週${ic?"（今週）":""}</span><span style="font-size:11px;color:${ic?"#888":"#bbb"};margin-left:8px">${m.getMonth()+1}/${m.getDate()} 〜 ${s.getMonth()+1}/${s.getDate()}</span></div>
            ${(wt.length+wd.length)>0?`<span style="font-size:12px;color:${ic?"#aaa":"#ccc"}">${wd.length}/${wt.length+wd.length}</span>`:""}
          </div>
          <div style="padding:8px 14px">
            ${weekInput(wk)}
            ${wt.length===0&&wd.length===0?'<p style="font-size:13px;color:#ccc;margin:4px 0 6px">タスクなし</p>':""}
            ${wt.map(t=>taskHTML(t,true,"今日へ",`set({movingToDay:'${t.id}'})`)). join("")}
            ${wd.map(t=>taskHTML(t,true)).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }
  else if(tab==="今月"){
    h+=`<div style="margin-top:16px">${progBar([...d.monthTasks,...d.monthDone])}${inputRow("monthInput","今月の目標を追加…")}
      <div style="margin-top:10px">
        ${d.monthTasks.length===0&&d.monthDone.length===0?'<p class="empty-msg">今月の目標を追加しよう</p>':""}
        ${d.monthTasks.map(t=>monthTaskHTML(t)).join("")}
        ${d.monthDone.length>0?`<div style="margin-top:8px"><p style="font-size:11px;color:#333;margin:0 0 6px 2px">完了 ${d.monthDone.length}件</p>${d.monthDone.map(t=>taskHTML(t)).join("")}</div>`:""}
      </div></div>`;
  }
  else if(tab==="今年"){
    h+=`<div style="margin-top:16px">${progBar(d.yearGoals)}${inputRow("yearInput","今年の目標を追加…")}
      <div style="margin-top:10px">${d.yearGoals.length===0?'<p class="empty-msg">今年の目標を追加しよう</p>':d.yearGoals.map(t=>taskHTML(t)).join("")}</div></div>`;
  }
  else if(tab==="完了"){
    h+=`<div style="margin-top:16px">${d.completedAll.length===0?'<p class="empty-msg">完了したタスクはまだなし</p>':`<p style="font-size:12px;color:#333;margin-bottom:12px">期間が終わった完了タスク · ${d.completedAll.length}件</p>${d.completedAll.map(t=>{let lb="";if(t.period.startsWith("d")){const m=t.period.match(/^d(\d+)-(\d+)-(\d+)$/);if(m)lb=`${+m[2]+1}/${m[3]}`;}else if(t.period.startsWith("w")){const m=t.period.match(/^w(\d+)-(\d+)$/);if(m)lb=`第${+m[2]}週`;}else if(t.period.startsWith("m")){const m=t.period.match(/^m(\d+)-(\d+)$/);if(m)lb=`${+m[2]+1}月`;}return`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,0.75);border:1px solid rgba(236,233,228,0.7);opacity:0.7;backdrop-filter:blur(8px)"><div style="width:18px;height:18px;border-radius:4px;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0">${CHKSM}</div><span style="flex:1;font-size:14px;color:#999;text-decoration:line-through;line-height:1.4">${esc(t.text)}</span><span style="font-size:11px;color:#ccc;flex-shrink:0">${lb}</span><button class="opt-del" onclick="removeTask('${t.id}')">✕</button></div>`;}).join("")}`}</div>`;
  }

  h+=modalHTML();
  document.getElementById("app").innerHTML=h;
  attachListeners();
}

function attachListeners(){
  ["yearInput","monthInput","dayInput","habitInput"].forEach(key=>{
    const el=document.getElementById("inp-"+key);if(!el)return;
    let c=false;
    el.addEventListener("compositionstart",()=>c=true);
    el.addEventListener("compositionend",()=>{c=false;});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"&&!c){e.preventDefault();handleAdd(key);}});
    el.addEventListener("keyup",e=>{if(e.key==="Enter"&&!c){e.preventDefault();handleAdd(key);}});
    el.addEventListener("input",e=>{
      const v=e.target.value;
      if(!c && (v.endsWith("\n") || v.includes("\n"))){
        e.target.value=v.replace(/\n/g,"");
        S[key]=e.target.value;
        handleAdd(key);
        return;
      }
      S[key]=v;
    });
  });
  document.querySelectorAll("[id^='winp-']").forEach(el=>{
    const wKey=el.id.replace("winp-","");
    let c=false;
    el.addEventListener("compositionstart",()=>c=true);
    el.addEventListener("compositionend",()=>{c=false;});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"&&!c){e.preventDefault();handleAddWeek(wKey);}});
    el.addEventListener("keyup",e=>{if(e.key==="Enter"&&!c){e.preventDefault();handleAddWeek(wKey);}});
    el.addEventListener("input",e=>{
      const v=e.target.value;
      const wi={...S.weekInputs};
      if(!c && (v.endsWith("\n") || v.includes("\n"))){
        e.target.value=v.replace(/\n/g,"");
        wi[wKey]=e.target.value;S.weekInputs=wi;
        handleAddWeek(wKey);
        return;
      }
      wi[wKey]=v;S.weekInputs=wi;
    });
    el.addEventListener("keydown",e=>{if(e.key==="Enter"&&!c)handleAddWeek(wKey);});
    el.addEventListener("input",e=>{const wi={...S.weekInputs};wi[wKey]=e.target.value;S.weekInputs=wi;});
  });
}

// Init
set({syncing:true});
loadGAS().then(data=>{
  if(data&&data.length>0){
    S.tasks=data;
    localStorage.setItem(KEY,JSON.stringify(data));
  }
  S.syncing=false;
  render();
});
</script>
